defaults:
  - all4one
  - _self_

name: "HPO-All4One-imagenet-100"
method: "hpo-all4one"
method_kwargs:
  join_feature_loss: true
hpo_kwargs:
  weights_optimizer: adam
  hp_group_params:
    lr: 0.1
  hpo_params:
    algorithm: sgd
    encoder_decoder: true
    regularization: 0
    rescale_grad_norm_weights: [0.5, 0.5, 5.0]
    ema:
      covs: 0.0
      stats: 0.99
    scale_gradients: 1
precision: 32-true
